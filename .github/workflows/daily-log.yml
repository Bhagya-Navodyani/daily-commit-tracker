name: Daily Commit Tracker

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  update-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Generate Log
        run: |
          DATE=$(date +'%Y-%m-%d')
          echo "## Statistics for $DATE" > README.md
          echo "* Repositories scanned: $(curl -s -H "Authorization: token ${{ secrets.GH_TOKEN }}" https://api.github.com/users/BhagyaNavodyani | jq '.public_repos')" >> README.md
          echo "* Total commits today: $(git log --oneline --since="24 hours ago" | wc -l)" >> README.md

      - name: Commit and Push
        run: |
          git config --global user.name "BhagyaNavodyani"
          git config --global user.email "bhagyanavodyani000@gmail.com"
          git add README.md
          git commit -m "Add daily activity log for $(date +'%Y-%m-%d')" || exit 0
          git push
